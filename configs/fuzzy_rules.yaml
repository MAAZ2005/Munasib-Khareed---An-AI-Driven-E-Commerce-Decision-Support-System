# ==============================================================================
# Munasib Khareed - Fuzzy Logic Consumer Risk Assessment Rules
# ==============================================================================
# Defines linguistic variables, membership functions, and rule base for
# evaluating consumer risk on a 0-100 continuous scale.
#
# Input variables are the proposal's five criteria (docs/proposal.pdf, 5.g):
# product_quality, evidence_strength, rating_reliability,
# negative_feedback_concentration and price_position. Each is fuzzified on
# [0, 1] with the low/medium/high triangular terms below.
#
# Rule base notes (renamed from the previous three inputs, logic preserved):
#   * negative_sentiment            -> negative_feedback_concentration (same
#     axis, term labels unchanged).
#   * aspect_complaint_intensity    -> product_quality and
#     evidence_volatility          -> rating_reliability point the opposite
#     direction, so only the low/high term labels were swapped in the rules
#     (a rule that said "complaints high" now says "quality low"); the
#     membership parameters and every consequent are unchanged, so each rule
#     keeps its original risk ordering (all-bad -> critical, all-good -> low).
#   * evidence_strength and price_position are declared for the risk engine
#     but are not referenced by any rule yet: adding antecedents would change
#     the rule logic, which this rename must not do.
# The output terms (low, moderate, high, critical) and all rule consequents
# are unchanged.

variables:
  inputs:
    product_quality:
      description: "Product quality from review evidence (0.0 to 1.0, higher is better)"
      universe: [0.0, 1.0]
      terms:
        low:
          type: "trimf"
          params: [0.0, 0.0, 0.35]
        medium:
          type: "trimf"
          params: [0.20, 0.45, 0.70]
        high:
          type: "trimf"
          params: [0.55, 1.0, 1.0]

    evidence_strength:
      description: "Strength of the review evidence base (0.0 to 1.0, higher is stronger)"
      universe: [0.0, 1.0]
      terms:
        low:
          type: "trimf"
          params: [0.0, 0.0, 0.35]
        medium:
          type: "trimf"
          params: [0.20, 0.45, 0.70]
        high:
          type: "trimf"
          params: [0.55, 1.0, 1.0]

    rating_reliability:
      description: "Consistency of the rating signal (0.0 to 1.0, higher is more reliable)"
      universe: [0.0, 1.0]
      terms:
        low:
          type: "trimf"
          params: [0.0, 0.0, 0.35]
        medium:
          type: "trimf"
          params: [0.20, 0.45, 0.70]
        high:
          type: "trimf"
          params: [0.55, 1.0, 1.0]

    negative_feedback_concentration:
      description: "Concentration of negative feedback in the reviews (0.0 to 1.0, higher is worse)"
      universe: [0.0, 1.0]
      terms:
        low:
          type: "trimf"
          params: [0.0, 0.0, 0.35]
        medium:
          type: "trimf"
          params: [0.20, 0.45, 0.70]
        high:
          type: "trimf"
          params: [0.55, 1.0, 1.0]

    price_position:
      description: "Price relative to peer products (0.0 = cheapest, 1.0 = priciest)"
      universe: [0.0, 1.0]
      terms:
        low:
          type: "trimf"
          params: [0.0, 0.0, 0.35]
        medium:
          type: "trimf"
          params: [0.20, 0.45, 0.70]
        high:
          type: "trimf"
          params: [0.55, 1.0, 1.0]

  output:
    consumer_risk:
      description: "Synthesized consumer risk score (0 to 100)"
      universe: [0.0, 100.0]
      terms:
        low:
          type: "trimf"
          params: [0.0, 15.0, 35.0]
        moderate:
          type: "trimf"
          params: [25.0, 45.0, 65.0]
        high:
          type: "trimf"
          params: [55.0, 75.0, 90.0]
        critical:
          type: "trimf"
          params: [80.0, 95.0, 100.0]

# Rule Base: IF (conditions) THEN (consumer_risk)
rules:
  - id: 1
    antecedents:
      negative_feedback_concentration: "low"
      product_quality: "high"
      rating_reliability: "high"
    consequent:
      consumer_risk: "low"

  - id: 2
    antecedents:
      negative_feedback_concentration: "low"
