      - "year"
      - "years"

    # Category-level vocabulary: an aspect must appear in at least this many
    # REVIEWS (not occurrences) before the aggregation stage may use it.
    min_review_count: 50
    top_k_aspects: 10
    vocabulary_path: "data/interim/aspect_vocabulary.parquet"
    vocabulary_csv_path: "reports/aspect_vocabulary.csv"

    # Cached candidate extraction and per-review output.
    review_aspects_path: "data/interim/review_aspects.parquet"
    candidate_parts_dir: "data/interim/aspect_candidates.parts"
    chunk_rows: 10000
    speed_sample_size: 2000

    # Product aggregation thresholds (all four pain-point conditions must hold).
    min_mentions: 5
    lift_smoothing: 5.0
    pain_point_min_lift: 1.5
    pain_point_min_negative_mentions: 3
    pain_point_min_negative_share: 0.25
    strength_min_positive_share: 0.75
    strength_max_negative_lift: 0.75
    max_examples: 3
    example_max_chars: 240

    # Drop product-aspects rows whose aspect tokens ALL appear in the product's
    # lemmatized title_clean/brand/category_leaf tokens (see docs/aspects.md).
    # Cached per-review aspects are never touched; set false to keep every row.
    exclude_self_reference: true
    self_reference_cache_path: "data/interim/product_self_tokens.json"

    # Manual audit sample (long format, blank annotations until a human fills it).
    audit_sample_size: 100
    audit_sample_path: "reports/aspect_audit_sample.csv"

  # Evidence-strength indicators
  evidence:
    min_length_chars: 20
    length_scale_chars: 200
    # Three-indicator composite served by the API and the stub service.
    # Unchanged by P14: the stored per-product table uses `strength` below.
    weights:
      verified_purchase: 0.50
      helpfulness_ratio: 0.30
      review_depth: 0.20
    # Per-product evidence indicators (scripts/compute_evidence.py).
    # Every formula, window and missing-data rule is documented in
    # docs/evidence.md; nothing is hardcoded in the modules.
    indicators:
      # Review count at which the volume sufficiency score reaches 1.0
      # (min(1, log(1 + n) / log(1 + n_saturation))).
      n_saturation: 200
      # A rating distribution is polarized when the 1-2 star share AND the
      # 5 star share both reach this value.
      polarization_min_share: 0.25
      # "Recent" ALWAYS means this many months before the dataset reference
      # date (meta.json review_date_range.max), never today's date.
      recent_months: 24
      # Minimum predicted-negative reviews inside the recent window before the
      # recent/overall negative-shift indicator is reported.
      min_recent_reviews: 10
      # Sentiment trend: OLS slope of quarterly mean net sentiment over this
      # many complete quarters before the reference quarter, requiring at
      # least min_trend_quarters qualifying quarters with at least
      # min_quarter_reviews reviews each.
      trend_quarters: 8
      min_trend_quarters: 4
      min_quarter_reviews: 5
      # Temporal burst: sliding window width in months; a product is flagged
      # when the largest share of its predicted-negative reviews inside one
      # sliding window reaches burst_flag_share.
      burst_window_months: 6
      burst_flag_share: 0.50
      # Minimum predicted-negative reviews before the negative-feedback
      # concentration inputs (aspect HHI, top pain-point share, burst) exist.
      min_negative_reviews: 10
      # Strong disagreement for rating/text agreement: 1-2 stars with
      # prob_positive above this value, or 4-5 stars with prob_negative above it.
      conflict_probability_threshold: 0.5
      # Conflict rate at which rating/text consistency reaches 0.0:
      # consistency = 1 - min(1, conflict_rate / conflict_saturation).
      conflict_saturation: 0.20
      # Number of pain-point aspects in the top-share numerator.
      top_pain_points: 3
      # Staleness cost curve: normalized = 1 / (1 + months / scale).
      staleness_scale_months: 12
      # Net-sentiment slope per quarter that saturates the trend indicator.
      trend_saturation: 0.25
    # Composite evidence strength stored in product_evidence (six components,
    # weights must sum to 1.0; unavailable components are dropped and the
    # remaining weights renormalized).
    strength:
      low_evidence_threshold: 0.40
      min_reviews_for_confidence: 50
      weights:
        review_volume: 0.25
        recency_coverage: 0.20
        verified_purchase_ratio: 0.15
        rating_agreement: 0.20
        rating_text_consistency: 0.15
        helpfulness_coverage: 0.05

# Product Intelligence: metadata-derived indicators for the risk stage
# (see docs/product_intelligence.md for every formula and tie rule).
product_intel:
  # A description counts as "complete" once it has at least this many words; a
  # longer description does not score above 1.0.
  target_description_words: 100
  # A feature list counts as "complete" once it has at least this many bullets.
  target_feature_count: 5
  # A brand needs at least this many OTHER priced products before its price
  # percentile means anything (a 2-product brand would always score 0 or 1).
  min_brand_peers: 5
  # A rank category needs at least this many OTHER ranked products before a
  # rank percentile is reported.
  min_rank_peers: 5
  # A category-breadcrumb prefix (from the metadata "category" breadcrumb) must
  # hold at least this many PRICED products before it is used as a product's
  # price peer group; otherwise the group falls back one level towards the whole
  # candidate set. Comparability is the point: a 4-product leaf node cannot say
  # whether a price is ordinary, and neither can a mixed whole-category set.
  min_price_peers: 10
  # Fields whose share of presence is reported as metadata_completeness (0-1).
  metadata_fields:
    - "title"
    - "brand"
    - "price"
    - "rank"
    - "description"
    - "features"

risk:
  fuzzy_rules_file: "configs/fuzzy_rules.yaml"
  scale_min: 0.0
  scale_max: 100.0
  default_defuzzification_method: "centroid"
  # Per-product decision criteria (scripts/compute_risk_indicators.py). Every
  # formula, constant and threshold below is documented in
  # docs/risk_indicators.md; nothing is hardcoded in the risk modules.
  criteria:
    # Pseudo-reviews of the category prior mixed into each product's rating and
    # sentiment: shrunk = (n * value + m * prior) / (n + m).
    shrinkage_m: 20
    product_quality:
      weights:
        shrunk_rating: 0.50
        shrunk_sentiment: 0.30
        recent_sentiment: 0.20
    rating_reliability:
      weights:
        rating_agreement: 0.35
        non_polarization: 0.20
        rating_text_consistency: 0.25
        helpfulness_agreement: 0.20
      # |helpfulness-weighted net - unweighted net| that drives the helpfulness
      # agreement component to 0: component = 1 - min(1, gap / scale).
      # The scale is re-chosen from the candidates below when more than
      # agreement_scale_max_zero_share of products would sit at exactly 0.
      agreement_scale: 0.10
      agreement_scale_candidates: [0.10, 0.20, 0.30]
      agreement_scale_max_zero_share: 0.25
    negative_feedback_concentration:
      # Shrunk predicted-negative share that saturates prevalence:
      # prevalence = min(1, shrunk_negative_share / p_saturation).
      p_saturation: 0.40
      # Diffuse negative feedback still counts this much:
      # value = prevalence * (focus_floor + (1 - focus_floor) * focus).
      focus_floor: 0.50
    price_position:
      # Confidence multiplier when the price peer group fell back to a
      # shorter breadcrumb prefix or the whole candidate set.
      fallback_confidence: 0.50
  factors:
    # Banded thresholds: a rule triggers at its first threshold (severity low)
    # and escalates at the next two (medium, high).
    recent_sentiment_decline:
      min_recent_predictions: 10
      min_delta: 0.10
      medium_delta: 0.20
      high_delta: 0.35
    polarized_ratings:
      medium_rating_agreement: 0.25
      high_rating_agreement: 0.10
    low_verified_share:
      max_verified_share: 0.70
      medium_verified_share: 0.55
      high_verified_share: 0.40
    weak_evidence:
      max_strength: 0.40
      medium_strength: 0.30
      high_strength: 0.20
    stale_reviews:
      min_months: 24.0
      medium_months: 36.0
      high_months: 48.0
    price_above_peers_with_low_quality:
      min_price_percentile: 0.75
      medium_price_percentile: 0.85
      high_price_percentile: 0.95
      max_product_quality: 0.40
    concentrated_complaints:
      min_top_share: 0.50
      medium_top_share: 0.65
      high_top_share: 0.80
    negative_burst:
      min_share: 0.50
      medium_share: 0.65
      high_share: 0.80
    rating_text_conflict:
      min_conflict_rate: 0.10
      medium_conflict_rate: 0.15
      high_conflict_rate: 0.20

decision:
  criteria_weights_file: "configs/criteria_weights.yaml"
  peer_sample_size: 20  # Sampled peer set from category for TOPSIS ranking
  normalize_method: "vector"  # Vector normalization as standard TOPSIS practice

xai:
  # Surrogate regressor for SHAP explanation
  surrogate_model_type: "random_forest"  # Random forest regressor fitting fuzzy/TOPSIS risk
  n_estimators: 100
  max_depth: 6
  min_fidelity_r2: 0.80  # Minimum acceptable R2 score for surrogate validity
  background_sample_size: 50

verdict:
  thresholds_file: "configs/verdict_thresholds.yaml"

analysis:
  # Which analysis service the API serves (consumed by src/munasib/api/deps.py).
  # "stub" is the deterministic placeholder in src/munasib/pipeline/service.py:
  # real evidence numbers, clearly-labelled placeholder risk scores.
  # "hybrid" serves real stored sentiment, aspects and evidence with placeholders for unbuilt stages.
  # "real" is the fuzzy + TOPSIS engine, which is not written yet - selecting it
  # fails with a documented error until it exists.
  service: "hybrid"

api:
  host: "127.0.0.1"
  port: 8000
  reload: true
  workers: 1
  cors_origins:
    - "http://localhost:8501"  # Streamlit default port
    - "http://127.0.0.1:8501"

# Local product-image cache (display only; the dashboard never hotlinks).
# `scripts/download_images.py` fills `directory` with one resized, metadata-stripped
# JPEG per ASIN; `GET /products/{asin}/image` serves them from disk so the UI works
# offline. The cache directory is git-ignored (only `.gitkeep` is tracked).
images:
  directory: "data/images"
  # Longest side of the stored thumbnail, in pixels (aspect ratio preserved).
  thumbnail_max_side: 320
  # Polite pause between two downloads, in seconds (never hammer the host).
  download_delay_seconds: 0.5
  timeout_seconds: 15.0
  # Sent as the User-Agent on every request; identifies the project, never a browser.
  user_agent: "MunasibKhareed/0.1 (academic FYP; local product-thumbnail cache; contact: munasib-khareed-fyp@example.invalid)"
  # Cache-Control max-age advertised by the image endpoint (cached files are immutable).
  cache_max_age_seconds: 86400

# Thresholds for scripts/suggest_demo_products.py (candidate ASINs for a live demo).
# A candidate must have an image candidate URL and at least min_usable_alternatives
# usable in-subset alternatives, so every suggested product can be compared.
demo_products:
  per_group: 10
  min_usable_alternatives: 3
  well_reviewed:
    mean_rating_min: 4.5
    min_reviews: 100
  polarized:
    # Share of the product's reviews that are 5-star and 1-2 star respectively:
    # both camps must be materially present for the polarization story to hold.
    five_star_share_min: 0.25
    low_star_share_min: 0.25
  low_rated:
    mean_rating_max: 3.0

logging:
  level: "INFO"
  file_path: "logs/munasib.log"
  max_bytes: 10485760  # 10 MB
  backup_count: 5
  format: "%(asctime)s | %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)d - %(message)s"
