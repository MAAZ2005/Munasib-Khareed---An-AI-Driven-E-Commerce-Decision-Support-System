# ==============================================================================
# Munasib Khareed - Master Configuration
# ==============================================================================
# All paths, hyperparameters, model identifiers, and seeds are declared here.
# Values can be overridden at runtime via environment variables (MUNASIB_*).

project:
  name: "munasib"
  display_name: "Munasib Khareed"
  version: "0.1.0"
  environment: "development"
  random_seed: 42

paths:
  data_dir: "data"
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  db_path: "data/db/munasib.sqlite"
  models_dir: "models"
  reports_dir: "reports"
  logs_dir: "logs"

dataset:
  # Selected UCSD Amazon Review Data (2018) category
  # Switching category is a one-line change (all sources below are pre-registered):
  category: "Appliances"
  sample_size: null  # null means process full category, or set integer for quick testing
  min_reviews_per_product: 5
  max_reviews_per_product: 500

  # Per-category source files (FULL per-category review file + per-category metadata file).
  # NOTE: these are deliberately NOT the 5-core subsets; the Appliances 5-core file has
  # only ~2,277 reviews, far too few for per-product evidence analysis.
  sources:
    Appliances:
      reviews_url: "https://mcauleylab.ucsd.edu/public_datasets/data/amazon_v2/categoryFiles/Appliances.json.gz"
      metadata_url: "https://mcauleylab.ucsd.edu/public_datasets/data/amazon_v2/metaFiles2/meta_Appliances.json.gz"
    Luxury_Beauty:
      reviews_url: "https://mcauleylab.ucsd.edu/public_datasets/data/amazon_v2/categoryFiles/Luxury_Beauty.json.gz"
      metadata_url: "https://mcauleylab.ucsd.edu/public_datasets/data/amazon_v2/metaFiles2/meta_Luxury_Beauty.json.gz"

  # Decision rubric thresholds for notebooks/01_dataset_audit.py.
  # All values live here (never in code); the audit prints PASS/FAIL per criterion.
  audit:
    # "Candidate product" = product with at least this many reviews (also used by the
    # min_candidate_products criterion below).
    candidate_min_reviews: 50
    # Criterion 1: share of candidate products whose metadata has a parsable price.
    min_price_coverage: 0.70
    # Criterion 2: minimum number of products with >= candidate_min_reviews reviews.
    min_candidate_products: 500
    # Criterion 3: share of candidate products with non-empty related-product links.
    min_related_links_share: 0.60
    # Category to recommend switching to when any criterion FAILs.
    fallback_category: "Luxury_Beauty"

  # Product-level train/val/test split (leakage-safe: every review inherits the
  # split of its product). Fractions must sum to 1.0. Products are stratified by
  # average-rating bin x review-count bin, then shuffled with `seed` inside each
  # stratum, so re-running the build with the same seed yields identical splits.
  split:
    train_fraction: 0.70
    val_fraction: 0.15
    test_fraction: 0.15
    # Kept separate from project.random_seed so split stability is independent
    # of other randomness; change only if you intentionally want new splits.
    seed: 42
    # Interior cut points (strictly ascending). Average-rating bins:
    # (-inf, 3.5], (3.5, 4.5], (4.5, inf).
    rating_bin_edges: [3.5, 4.5]
    # Review-count bins: (-inf, 75], (75, 150], (150, 400], (400, inf).
    review_count_bin_edges: [75.0, 150.0, 400.0]

review_intel:
  # Sentiment analysis
  sentiment:
    # Weak supervision mapping from star ratings (locked FYP design decision)
    # Ratings 1-2: negative (0), Rating 3: neutral (1), Ratings 4-5: positive (2)
    rating_mapping:
      negative_max: 2
      neutral_val: 3
      positive_min: 4

    # --- Weak-supervision baseline (TF-IDF + logistic regression) ------------
    # Review column holding the text and the column holding the weak label.
    # `review_text_clean` is the cleaned text the models read; `_raw` is display-only.
    text_column: "review_text_clean"
    label_column: "sentiment_label_weak"
    # Cap per product so one 6,510-review product cannot dominate the sample.
    max_reviews_per_product: 50
    # Overall row budget: positive reviews are subsampled to reach it; negatives
    # and neutrals are kept in full (never dropped just to hit the budget).
    max_train_rows: 100000
    # Shortest review text (characters) that may enter training or evaluation.
    min_chars: 3
    # Seed for the deterministic review selection (never the global RNG).
    seed: 42
    # Token budget every neural model truncates and pads to.
    max_length_tokens: 128
    tfidf:
      # Word unigrams + bigrams, terms seen in >= 3 documents, capped vocabulary.
      ngram_range: [1, 2]
      min_df: 3
      max_features: 200000
      sublinear_tf: true
    logreg:
      C: 1.0
      max_iter: 1000

    # --- Neural models -------------------------------------------------------
    # Class weighting used by the neural loss: none | sqrt_inverse | balanced.
    # `sqrt_inverse` sits between ignoring the class mix and full balancing,
    # which over-states negativity in the downstream risk stage.
    class_weighting: "sqrt_inverse"

    # DistilBERT fine-tuning. Linear warmup then decay (warmup_ratio of the total
    # steps), AdamW, gradient clipping, early stopping on validation macro-F1.
    transformer:
      model_name: "distilbert-base-uncased"
      learning_rate: 0.00003
      batch_size: 32
      epochs: 3
      warmup_ratio: 0.06
      weight_decay: 0.01
      max_grad_norm: 1.0
      early_stopping_patience: 1
      output_dir: "models/sentiment_distilbert"

    # BiGRU/BiLSTM from scratch. The vocabulary is fitted on the training sample
    # only (terms seen >= min_freq times, capped at vocab_size). The learning
    # rate is separate from the transformer's: a scratch model at a fine-tuning
    # rate barely moves.
    rnn:
      embedding_dim: 128
      hidden_size: 128
      num_layers: 1
      bidirectional: true
      dropout: 0.3
      vocab_size: 50000
      min_freq: 2
      cell: "gru"
      learning_rate: 0.001
      output_dir: "models/sentiment_rnn"

    # Fitted artifact (git-ignored `models/`) and evaluation reports.
    model_path: "models/sentiment_tfidf_logreg.joblib"
    report_dir: "reports/evaluation"

    # --- Batch scoring -------------------------------------------------------
    # Reusable predictor settings (scripts/predict_reviews.py). `checkpoint` is
    # the `best/` directory written by the trainer; scoring reads every review of
    # the input table and writes per-review probabilities to the output parquet,
    # with a `.meta.json` sidecar recording the checkpoint hashes.
    prediction:
      checkpoint: "models/sentiment_distilbert/best"
      input_path: "data/processed/reviews.parquet"
      output_path: "data/interim/review_predictions.parquet"
      # Rows per forward pass on CPU/GPU.
      batch_size: 64
      # Rows per resumable chunk; completed chunks survive a Colab disconnect.
      chunk_rows: 25000

  # Aspect-based attribute extraction (see docs/aspects.md)
  aspects:
    # spaCy noun-chunk extractor. The extractor needs the tagger, parser,
    # attribute ruler and lemmatizer; only NER is disabled (never used).
    spacy_model: "en_core_web_sm"
    spacy_disable_components: ["ner"]
    n_process: 1
    batch_size: 128
    # Longest review prefix handed to spaCy; the rest is not analysed.
    max_text_chars: 5000
    # Shortest lemma (characters) that may enter an aspect phrase.
    min_token_chars: 2
    # Maximum nominal words in an aspect phrase (1 or 2).
    max_aspect_tokens: 2
    # Generic nouns that are never aspects. Person words, review-meta words and
    # vague nouns are excluded; service aspects (delivery, shipping, seller,
    # packaging, box) are deliberately kept.
    generic_nouns:
      - "adult"
      - "advise"
      - "amazon"
      - "anyone"
      - "anything"
      - "baby"
      - "bit"
      - "bits"
      - "boss"
      - "boyfriend"
      - "brother"
      - "buy"
      - "buyer"
      - "buyers"
      - "buying"
      - "child"
      - "claim"
      - "co"
      - "customer"
      - "customers"
      - "dad"
      - "dads"
      - "daughter"
      - "daughters"
      - "day"
      - "days"
      - "dec"
      - "describe"
      - "described"
      - "description"
      - "everyone"
      - "everything"
      - "families"
      - "family"
      - "father"
      - "feb"
      - "feedback"
      - "fiance"
      - "following"
      - "friend"
      - "friends"
