# ==============================================================================
# Munasib Khareed - Master Configuration
# ==============================================================================
# All paths, hyperparameters, model identifiers, and seeds are declared here.
# Values can be overridden at runtime via environment variables (MUNASIB_*).

project:
  name: "munasib"
  display_name: "Munasib Khareed"
  version: "0.1.0"
  environment: "development"
  random_seed: 42

paths:
  data_dir: "data"
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  db_path: "data/db/munasib.sqlite"
  models_dir: "models"
  reports_dir: "reports"
  logs_dir: "logs"

dataset:
  # Selected UCSD Amazon Review Data (2018) category
  # Switching category is a one-line change (all sources below are pre-registered):
  category: "Appliances"
  sample_size: null  # null means process full category, or set integer for quick testing
  min_reviews_per_product: 5
  max_reviews_per_product: 500

  # Per-category source files (FULL per-category review file + per-category metadata file).
  # NOTE: these are deliberately NOT the 5-core subsets; the Appliances 5-core file has
  # only ~2,277 reviews, far too few for per-product evidence analysis.
  sources:
    Appliances:
      reviews_url: "https://mcauleylab.ucsd.edu/public_datasets/data/amazon_v2/categoryFiles/Appliances.json.gz"
      metadata_url: "https://mcauleylab.ucsd.edu/public_datasets/data/amazon_v2/metaFiles2/meta_Appliances.json.gz"
    Luxury_Beauty:
      reviews_url: "https://mcauleylab.ucsd.edu/public_datasets/data/amazon_v2/categoryFiles/Luxury_Beauty.json.gz"
      metadata_url: "https://mcauleylab.ucsd.edu/public_datasets/data/amazon_v2/metaFiles2/meta_Luxury_Beauty.json.gz"

  # Decision rubric thresholds for notebooks/01_dataset_audit.py.
  # All values live here (never in code); the audit prints PASS/FAIL per criterion.
  audit:
    # "Candidate product" = product with at least this many reviews (also used by the
    # min_candidate_products criterion below).
    candidate_min_reviews: 50
    # Criterion 1: share of candidate products whose metadata has a parsable price.
    min_price_coverage: 0.70
    # Criterion 2: minimum number of products with >= candidate_min_reviews reviews.
    min_candidate_products: 500
    # Criterion 3: share of candidate products with non-empty related-product links.
    min_related_links_share: 0.60
    # Category to recommend switching to when any criterion FAILs.
    fallback_category: "Luxury_Beauty"

  # Product-level train/val/test split (leakage-safe: every review inherits the
  # split of its product). Fractions must sum to 1.0. Products are stratified by
  # average-rating bin x review-count bin, then shuffled with `seed` inside each
  # stratum, so re-running the build with the same seed yields identical splits.
  split:
    train_fraction: 0.70
    val_fraction: 0.15
    test_fraction: 0.15
    # Kept separate from project.random_seed so split stability is independent
    # of other randomness; change only if you intentionally want new splits.
    seed: 42
    # Interior cut points (strictly ascending). Average-rating bins:
    # (-inf, 3.5], (3.5, 4.5], (4.5, inf).
    rating_bin_edges: [3.5, 4.5]
    # Review-count bins: (-inf, 75], (75, 150], (150, 400], (400, inf).
    review_count_bin_edges: [75.0, 150.0, 400.0]

review_intel:
  # Sentiment analysis
  sentiment:
    model_name: "distilbert-base-uncased"
    max_sequence_length: 256
    batch_size: 32
    # Weak supervision mapping from star ratings (locked FYP design decision)
    # Ratings 1-2: negative (0), Rating 3: neutral (1), Ratings 4-5: positive (2)
    rating_mapping:
      negative_max: 2
      neutral_val: 3
      positive_min: 4

  # Aspect-based attribute extraction
  aspects:
    spacy_model: "en_core_web_sm"
    min_aspect_frequency: 3
    top_k_aspects: 10

  # Evidence-strength indicators
  evidence:
    min_length_chars: 20
    length_scale_chars: 200
    weights:
      verified_purchase: 0.50
      helpfulness_ratio: 0.30
      review_depth: 0.20

# Product Intelligence: metadata-derived indicators for the risk stage
# (see docs/product_intelligence.md for every formula and tie rule).
product_intel:
  # A description counts as "complete" once it has at least this many words; a
  # longer description does not score above 1.0.
  target_description_words: 100
  # A feature list counts as "complete" once it has at least this many bullets.
  target_feature_count: 5
  # A brand needs at least this many OTHER priced products before its price
  # percentile means anything (a 2-product brand would always score 0 or 1).
  min_brand_peers: 5
  # A rank category needs at least this many OTHER ranked products before a
  # rank percentile is reported.
  min_rank_peers: 5
  # A category-breadcrumb prefix (from the metadata "category" breadcrumb) must
  # hold at least this many PRICED products before it is used as a product's
  # price peer group; otherwise the group falls back one level towards the whole
  # candidate set. Comparability is the point: a 4-product leaf node cannot say
  # whether a price is ordinary, and neither can a mixed whole-category set.
  min_price_peers: 10
  # Fields whose share of presence is reported as metadata_completeness (0-1).
  metadata_fields:
    - "title"
    - "brand"
    - "price"
    - "rank"
    - "description"
    - "features"

risk:
  fuzzy_rules_file: "configs/fuzzy_rules.yaml"
  scale_min: 0.0
  scale_max: 100.0
  default_defuzzification_method: "centroid"

decision:
  criteria_weights_file: "configs/criteria_weights.yaml"
  peer_sample_size: 20  # Sampled peer set from category for TOPSIS ranking
  normalize_method: "vector"  # Vector normalization as standard TOPSIS practice

xai:
  # Surrogate regressor for SHAP explanation
  surrogate_model_type: "random_forest"  # Random forest regressor fitting fuzzy/TOPSIS risk
  n_estimators: 100
  max_depth: 6
  min_fidelity_r2: 0.80  # Minimum acceptable R2 score for surrogate validity
  background_sample_size: 50

verdict:
  thresholds_file: "configs/verdict_thresholds.yaml"

analysis:
  # Which analysis service the API serves (consumed by src/munasib/api/deps.py).
  # "stub" is the deterministic placeholder in src/munasib/pipeline/service.py:
  # real evidence numbers, clearly-labelled placeholder risk scores.
  # "real" is the fuzzy + TOPSIS engine, which is not written yet - selecting it
  # fails with a documented error until it exists, so this stays "stub" by default.
  service: "stub"

api:
  host: "127.0.0.1"
  port: 8000
  reload: true
  workers: 1
  cors_origins:
    - "http://localhost:8501"  # Streamlit default port
    - "http://127.0.0.1:8501"

# Local product-image cache (display only; the dashboard never hotlinks).
# `scripts/download_images.py` fills `directory` with one resized, metadata-stripped
# JPEG per ASIN; `GET /products/{asin}/image` serves them from disk so the UI works
# offline. The cache directory is git-ignored (only `.gitkeep` is tracked).
images:
  directory: "data/images"
  # Longest side of the stored thumbnail, in pixels (aspect ratio preserved).
  thumbnail_max_side: 320
  # Polite pause between two downloads, in seconds (never hammer the host).
  download_delay_seconds: 0.5
  timeout_seconds: 15.0
  # Sent as the User-Agent on every request; identifies the project, never a browser.
  user_agent: "MunasibKhareed/0.1 (academic FYP; local product-thumbnail cache; contact: munasib-khareed-fyp@example.invalid)"
  # Cache-Control max-age advertised by the image endpoint (cached files are immutable).
  cache_max_age_seconds: 86400

# Thresholds for scripts/suggest_demo_products.py (candidate ASINs for a live demo).
# A candidate must have an image candidate URL and at least min_usable_alternatives
# usable in-subset alternatives, so every suggested product can be compared.
demo_products:
  per_group: 10
  min_usable_alternatives: 3
  well_reviewed:
    mean_rating_min: 4.5
    min_reviews: 100
  polarized:
    # Share of the product's reviews that are 5-star and 1-2 star respectively:
    # both camps must be materially present for the polarization story to hold.
    five_star_share_min: 0.25
    low_star_share_min: 0.25
  low_rated:
    mean_rating_max: 3.0

logging:
  level: "INFO"
  file_path: "logs/munasib.log"
  max_bytes: 10485760  # 10 MB
  backup_count: 5
  format: "%(asctime)s | %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)d - %(message)s"
