programme: "BS Computer Science, Final Year Project, Session Fall 2026"

description: >-
  Munasib Khareed ("Appropriate / Fair Purchase") is a virtual consumer advocate.
  Instead of optimising for a sale, it weighs the evidence behind a product's
  reviews, quantifies how risky a purchase looks on a 0-100 scale, and explains
  that assessment in plain language before recommending a decision.

# The pipeline, one stage per line (rendered joined by " -> ").
